[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.poetry]
package-mode = false

[project]
name = "falafacil"
dynamic = ["version"]
description = "Transcrição de voz em português para Ubuntu com Gemini"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.7",
    "google-genai>=2.3.0",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "keyring>=25.0",
    "secretstorage>=3.3",
    "evdev>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.11"]

[project.scripts]
falafacil = "falafacil.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "falafacil.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
