[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falafacil"
version = "0.1.0"
description = "Transcrição de voz em português para Ubuntu com Gemini"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.7",
    "google-genai>=2.3.0",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "keyring>=25.0",
    "secretstorage>=3.3",
    "pynput>=1.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.11"]

[project.scripts]
falafacil = "falafacil.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
